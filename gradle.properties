# ---------------------------------------------------------------------------
# Project identity
# ---------------------------------------------------------------------------
group=com.cleanerlogs
version=1.0.0

# ---------------------------------------------------------------------------
# Build hygiene / reproducible builds
# ---------------------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# The build never downloads a JDK. Every module is compiled with --release so the
# produced bytecode is always Java 21, whatever JDK happens to run Gradle.
org.gradle.java.installations.auto-download=false

# ---------------------------------------------------------------------------
# Dependency versions
# ---------------------------------------------------------------------------
# Compiled against the oldest Log4j2 line we intend to support (Minecraft 1.18+).
# log4j-core is provided by every server we target and is never bundled.
log4jVersion=2.17.1
junitVersion=5.10.2
# Oldest practical Bukkit API that already contains everything this plugin needs.
spigotApiVersion=1.21-R0.1-SNAPSHOT
# Compile-only Fabric Loader API. Only APIs that have been stable since Loader 0.4
# are used, so older loaders still satisfy the runtime dependency range.
fabricLoaderVersion=0.19.5

# ---------------------------------------------------------------------------
# Toolchain
# ---------------------------------------------------------------------------
# Java 21 bytecode so the artifact runs on Java 21 (Minecraft 1.21 era) and on the
# newer runtimes used by Minecraft 26.x.
javaRelease=21
